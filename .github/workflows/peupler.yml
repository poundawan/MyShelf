# « Peupler la base »
#
# Installe le jeu de démonstration dans la base Supabase de production, depuis
# l'interface web de GitHub — sans terminal.
#
# Ce workflow ne se déclenche QUE à la main (`workflow_dispatch`) : il n'est
# jamais lancé par un push ni par une pull request, et une branche venue d'un
# fork n'a de toute façon jamais accès aux secrets. Seules les personnes ayant
# le droit d'écrire sur le dépôt peuvent le déclencher — ce qui compte, le
# dépôt étant public.
name: Peupler la base de production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écris « peupler » pour confirmer (garde-fou contre un clic de travers)"
        required: true
        default: ""
      forcer:
        description: "Installer la démo même si la base contient déjà des jeux — à ne choisir qu'une fois, sinon doublons"
        type: choice
        default: "non"
        options: ["non", "oui"]

jobs:
  peupler:
    name: Migrations et jeu de démonstration
    runs-on: ubuntu-latest
    # Sans cette borne, un blocage court jusqu'à la limite de GitHub : six
    # heures. C'est arrivé. Le travail réel se compte en minutes ; au-delà,
    # c'est que quelque chose attend ce qui ne viendra pas.
    timeout-minutes: 20

    env:
      # Les deux doivent pointer sur le POOLER Supabase (aws-0-….pooler.
      # supabase.com). La connexion dite « directe » de Supabase n'existe qu'en
      # IPv6, dont les machines de GitHub Actions ne disposent pas : elle
      # échouerait ici avec une erreur de résolution difficile à lire.
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Vérifier la confirmation
        if: inputs.confirmation != 'peupler'
        run: |
          echo "::error::Confirmation absente ou incorrecte. Relance en écrivant « peupler » dans le champ prévu."
          exit 1

      # Les deux chaînes sont vérifiées ici, et pas seulement l'une d'elles :
      # `prisma migrate deploy` se sert de DIRECT_URL, si bien qu'une erreur
      # dans ce secret-là ressortait trois étapes plus loin sous la forme d'un
      # « P1013 » de Prisma qui ne dit ni quelle variable est en cause, ni
      # pourquoi. On préfère échouer tout de suite, en nommant le coupable.
      - name: Vérifier la forme des chaînes de connexion
        run: |
          # N'affiche jamais que l'hôte et le port, jamais l'identifiant ni le
          # mot de passe — et seulement après extraction réussie. La version
          # précédente renvoyait la chaîne entière quand elle ne correspondait
          # pas au motif attendu, et ne devait qu'au masquage de GitHub de ne
          # pas l'avoir divulguée.
          verifier() {
            nom="$1"; valeur="$2"
            if [ -z "$valeur" ]; then
              echo "::error::$nom est absent ou vide."
              echo "::error::Dépôt → Settings → Secrets and variables → Actions → New repository secret."
              return 1
            fi
            case "$valeur" in
              postgresql://*|postgres://*) ;;
              *)
                echo "::error::$nom ne commence pas par « postgresql:// »."
                echo "::error::Causes habituelles : le nom de la variable recopié devant la valeur (DATABASE_URL=…), des guillemets autour, un préfixe « psql », un espace ou un retour à la ligne au début, ou les paramètres de connexion recopiés un par un au lieu de l'URI."
                return 1 ;;
            esac
            # On isole d'abord l'autorité (ce qui précède le premier « / »
            # après le schéma), puis on retient ce qui suit le DERNIER « @ ».
            # Couper au premier laisserait échapper un morceau de mot de passe
            # quand celui-ci en contient un.
            autorite="${valeur#*://}"
            autorite="${autorite%%/*}"
            hote="${autorite##*@}"
            if [ "$hote" = "$autorite" ]; then
              echo "::error::$nom ne contient pas de « @ » : il manque la partie identifiant:mot-de-passe."
              return 1
            fi
            echo "$nom → $hote"
          }

          defaut=0
          verifier PROD_DATABASE_URL "$DATABASE_URL" || defaut=1
          verifier PROD_DIRECT_URL "$DIRECT_URL" || defaut=1
          if [ "$defaut" -ne 0 ]; then
            echo "::error::Forme attendue : postgresql://postgres.<ref>:<mot-de-passe>@aws-<n>-<région>.pooler.supabase.com:<port>/postgres"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` déclenche `postinstall` → `prisma generate` : le client Prisma
      # est un fichier généré, le seed ne peut pas démarrer sans lui.
      - name: Installer les dépendances
        run: npm ci

      # Sans effet si les tables sont déjà là ; indispensable au premier coup.
      # Passe par DIRECT_URL — voir prisma.config.ts : appliquer des migrations
      # au travers du pooler transactionnel fait attendre sans fin.
      - name: Appliquer les migrations
        timeout-minutes: 5
        run: npx prisma migrate deploy

      # Le seed charge d'abord le référentiel des communes (37 283 localités),
      # puis REFUSE de continuer si la base contient déjà des jeux. Il est donc
      # sans danger à relancer : il ne créera jamais de doublons.
      #
      # « forcer » lève ce refus. C'est utile une fois, et une seule : quand la
      # base contient déjà autre chose — des comptes et des jeux saisis à la
      # main — et qu'on veut y ajouter la démo à côté. Rien n'y est dupliqué
      # puisque la démo n'y est pas encore. Lancé une deuxième fois, en
      # revanche, il recrée tout : un second club, une seconde série de jeudis,
      # les mêmes échanges en double. Le seed n'a aucune clé naturelle pour
      # s'en rendre compte, d'où le refus par défaut.
      - name: Installer le jeu de démonstration
        id: seed
        env:
          SEED_FORCE: ${{ inputs.forcer == 'oui' && '1' || '' }}
        run: |
          set -o pipefail
          if [ "$SEED_FORCE" = "1" ]; then
            echo "::warning::Garde-fou levé : la démo sera installée même si la base contient déjà des jeux. À ne pas relancer tel quel — le second passage créerait des doublons."
          fi
          npx tsx prisma/seed.ts | tee seed.log
          # Le récapitulatif doit dire ce qui s'est passé, pas ce qu'on
          # espérait. Un seed qui renonce est un succès pour GitHub — et le
          # résumé annonçait pourtant « base peuplée », ce qui a fait chercher
          # des données absentes du mauvais côté.
          if grep -q "Base déjà peuplée" seed.log; then
            echo "installe=non" >> "$GITHUB_OUTPUT"
          else
            echo "installe=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Récapitulatif
        if: success()
        run: |
          if [ "${{ steps.seed.outputs.installe }}" != "oui" ]; then
            {
              echo "### Rien n'a été installé"
              echo ""
              echo "La base contenait déjà des jeux, le seed a donc renoncé — c'est son"
              echo "garde-fou contre les doublons, pas une panne. Les migrations et le"
              echo "référentiel des communes, eux, sont bien à jour."
              echo ""
              echo "Pour ajouter quand même le jeu de démonstration à côté de l'existant :"
              echo "relance en mettant **forcer** sur \`oui\`. À ne faire qu'une fois."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Base peuplée"
            echo ""
            echo "Comptes de démonstration, mot de passe \`password123\` :"
            echo ""
            echo "- chloe@example.com — Chloé Barrat"
            echo "- marius@example.com, lea@example.com, bastien@example.com,"
            echo "  sofiane@example.com, amandine@example.com"
            echo ""
            echo "Ces comptes sont **publics** : leur mot de passe figure dans le README."
            echo "À traiter comme une vitrine, pas comme de vrais utilisateurs."
          } >> "$GITHUB_STEP_SUMMARY"
